<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nepal drone flights</title>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.6.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root {
    --airborne: #e0342a; --planned: #e08a00; --landed: #7c848e;
    --stale: #a734c8;    --unparsed: #2d6fd8; --bg: #11151a; --fg: #f2f5f8;
  }
  * { box-sizing: border-box }
  html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, sans-serif;
               background: var(--bg); color: var(--fg) }
  #map { position: absolute; inset: 44px 0 0 0 }
  #bar { position: absolute; inset: 0 0 auto 0; height: 44px; display: flex;
         align-items: center; gap: 18px; padding: 0 14px; background: #0b0e12;
         border-bottom: 1px solid #232a33; z-index: 2 }
  #bar b { font-size: 16px; letter-spacing: .3px }
  .count { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums }
  .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block }
  #age { margin-left: auto; font-variant-numeric: tabular-nums; color: #9aa4b0 }
  #alarm { position: absolute; inset: 44px 0 auto 0; padding: 14px;
           background: #b3140a; color: #fff; font-size: 17px; font-weight: 600;
           text-align: center; z-index: 3; display: none }
  body.stale #alarm { display: block }
  body.stale #map { filter: grayscale(1) brightness(.65) }
  #legend { position: absolute; left: 12px; bottom: 12px; z-index: 2;
            background: #0b0e12dd; border: 1px solid #232a33; border-radius: 6px;
            padding: 10px 12px; line-height: 1.9 }
  #legend div { display: flex; align-items: center; gap: 8px }
  .maplibregl-popup-content { background: #0b0e12; color: var(--fg);
                              border: 1px solid #2c343e; font-size: 13px }
  .maplibregl-popup-content b { display: block; margin-bottom: 4px }
  .maplibregl-popup-tip { border-top-color: #0b0e12 !important }
  .note { color: #9aa4b0; margin-top: 5px; font-style: italic }
</style>

<div id="bar">
  <b>Nepal drone flights</b>
  <span class="count"><i class="dot" style="background:var(--airborne)"></i><span id="c-airborne">0</span> in the air</span>
  <span class="count"><i class="dot" style="background:var(--planned)"></i><span id="c-planned">0</span> planned</span>
  <span class="count"><i class="dot" style="background:var(--stale)"></i><span id="c-stale">0</span> overdue</span>
  <span class="count"><i class="dot" style="background:var(--landed)"></i><span id="c-landed">0</span> landed</span>
  <span id="age">waiting for flight data…</span>
</div>
<div id="alarm">Flight data is not updating. Do not rely on this map.</div>
<div id="map"></div>
<div id="legend">
  <div><i class="dot" style="background:var(--airborne)"></i> currently in the air</div>
  <div><i class="dot" style="background:var(--planned)"></i> due to fly</div>
  <div><i class="dot" style="background:var(--stale)"></i> overdue - no landing message</div>
  <div><i class="dot" style="background:var(--landed)"></i> recently landed</div>
  <div><i class="dot" style="background:var(--unparsed)"></i> report received - flight times unclear</div>
</div>

<script type="module">
import * as maplibregl from "https://cdn.jsdelivr.net/npm/maplibre-gl@6.6.0/dist/maplibre-gl.mjs";

const FEED = "./flights.geojson";
const POLL_MS = 15000;
const TICK_MS = 1000;
const NEPAL_MIN = 5 * 60 + 45;

let map = null, mapReady = false, feed = null, lastGenerated = null, fitted = false;

const COLOUR = ["match", ["get", "status"],
  "airborne", "#e0342a", "planned", "#e08a00", "landed", "#7c848e",
  "stale", "#a734c8", "#2d6fd8"];
const STATUS_TEXT = {
  airborne: "in the air", planned: "planned", stale: "overdue",
  landed: "landed", unparsed: "flight times unclear"
};

try {
  map = new maplibregl.Map({
    container: "map",
    center: [85.30, 27.95],
    zoom: 9.2,
    style: {
      version: 8,
      sources: {
        osm: {
          type: "raster", tileSize: 256, maxzoom: 19,
          tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
          attribution: "© OpenStreetMap contributors"
        }
      },
      layers: [
        { id: "osm", type: "raster", source: "osm",
          paint: { "raster-saturation": -0.6, "raster-brightness-max": 0.82 } }
      ]
    }
  });
  map.addControl(new maplibregl.NavigationControl(), "top-right");
  map.addControl(new maplibregl.ScaleControl());
  map.on("error", e => console.error("Map error", e && e.error));
  map.on("load", onMapLoad);
} catch (err) {
  console.error("The map could not start", err);
  showFatal("The map did not load. The counts are still live; " +
            "this browser may not support WebGL 2.");
}

function showFatal(text) {
  const el = document.getElementById("alarm");
  el.textContent = text;
  document.body.classList.add("stale");
}

function onMapLoad() {
  map.addSource("flights", { type: "geojson", data: { type: "FeatureCollection", features: [] } });

  map.addLayer({
    id: "halo", type: "circle", source: "flights",
    filter: ["in", ["get", "status"], ["literal", ["airborne", "stale"]]],
    paint: {
      "circle-radius": 26, "circle-color": COLOUR, "circle-opacity": 0.18,
      "circle-blur": 0.4
    }
  });
  map.addLayer({
    id: "dot", type: "circle", source: "flights",
    paint: {
      "circle-radius": ["match", ["get", "status"], "airborne", 11, "stale", 11, 8],
      "circle-color": COLOUR,
      "circle-opacity": ["match", ["get", "status"], "planned", 0.35, "landed", 0.5, 1],
      "circle-stroke-width": 2,
      "circle-stroke-color": COLOUR,
      "circle-stroke-opacity": 0.95
    }
  });
  map.addLayer({
    id: "label", type: "symbol", source: "flights",
    layout: {
      "text-field": ["get", "label"], "text-size": 12, "text-offset": [0, 1.5],
      "text-anchor": "top", "text-allow-overlap": false,
      "text-font": ["Open Sans Regular", "Arial Unicode MS Regular"]
    },
    paint: { "text-color": "#f2f5f8", "text-halo-color": "#11151a", "text-halo-width": 1.6 }
  });

  map.on("click", "dot", e => {
    const p = e.features[0].properties;
    new maplibregl.Popup({ closeButton: false })
      .setLngLat(e.features[0].geometry.coordinates)
      .setHTML(
        `<b>Pilot ${p.pilot}</b>` +
        `${STATUS_TEXT[p.status] || p.status}<br>` +
        `take-off ${hhmm(p.takeoff)} &nbsp; landing ${hhmm(p.landing)}<br>` +
        `reported at ${hhmm(p.reported_at)}` +
        (p.note ? `<div class="note">“${escapeHtml(p.note)}”</div>` : "") +
        `<div class="note">${p.source}</div>`)
      .addTo(map);
  });
  map.on("mouseenter", "dot", () => map.getCanvas().style.cursor = "pointer");
  map.on("mouseleave", "dot", () => map.getCanvas().style.cursor = "");

  mapReady = true;
  render();
}

function hhmm(iso) {
  if (!iso) return "not reported";
  const d = new Date(iso);
  const n = new Date(d.getTime() + (NEPAL_MIN + d.getTimezoneOffset()) * 60000);
  return String(n.getHours()).padStart(2, "0") + ":" + String(n.getMinutes()).padStart(2, "0");
}
const escapeHtml = s => s.replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function mins(iso) {
  const m = Math.round((new Date(iso) - Date.now()) / 60000);
  return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`;
}

// Keep this in sync with status_of() so flights update between feed refreshes.
function statusOf(p, now, th) {
  const to = p.takeoff ? Date.parse(p.takeoff) : null;
  const ldg = p.landing ? Date.parse(p.landing) : null;
  const min = 60000;
  const PRE = th.pre_window_min * min, POST = th.post_window_min * min;
  const STALE = th.stale_after_min * min, DROP = th.drop_stale_after_min * min;
  if (!to && !ldg) {
    const seen = p.reported_at ? Date.parse(p.reported_at) : now;
    return now > seen + STALE ? null : p.status;
  }
  if (ldg && p.landing_confirmed && now >= ldg + POST) return null;
  if (to && now > to + DROP) return null;
  if (ldg && now >= ldg + POST) return "stale";
  if (ldg && now >= ldg) return "landed";
  if (to && now < to - PRE) return "planned";
  if (to && !ldg && now > to + STALE) return "stale";
  return "airborne";
}

function render() {
  if (!feed) return;
  const now = Date.now();
  const th = feed.properties.thresholds || {};
  const counts = { airborne: 0, planned: 0, stale: 0, landed: 0, unparsed: 0 };
  const features = [];

  for (const f of feed.features) {
    const p = { ...f.properties };
    const status = statusOf(p, now, th);
    if (!status) continue;
    p.status = status;
    counts[status] = (counts[status] || 0) + 1;
    p.label = `${p.pilot}\n` + (
      status === "planned" ? `starts in ${mins(p.takeoff)}` :
      status === "airborne" && p.landing ? `lands at ${hhmm(p.landing)}` :
      status === "stale" ? `overdue since ${hhmm(p.landing || p.takeoff)}` :
      status === "landed" ? `landed ${hhmm(p.landing)}` : "flight times unclear");
    features.push({ ...f, properties: p });
  }

  for (const s of ["airborne", "planned", "stale", "landed"])
    document.getElementById("c-" + s).textContent = counts[s] || 0;

  if (mapReady)
    map.getSource("flights").setData({ type: "FeatureCollection", features });
}

async function tick() {
  try {
    const res = await fetch(FEED, { cache: "no-cache" });
    if (!res.ok) throw new Error(res.status);
    feed = await res.json();
    render();

    lastGenerated = new Date(feed.properties.generated_at);
    if (mapReady && !fitted && feed.properties.bbox) {
      const b = feed.properties.bbox;
      map.fitBounds([[b[0], b[1]], [b[2], b[3]]], { padding: 60, duration: 0 });
      fitted = true;
    }
  } catch (err) {
    console.error("Could not load flight data", err);
  }
  paintAge();
}

function paintAge() {
  const el = document.getElementById("age");
  if (!lastGenerated) { el.textContent = "no flight data yet";
                        document.body.classList.add("stale"); return; }
  const secs = Math.round((Date.now() - lastGenerated) / 1000);
  const stale = secs > 180;
  el.textContent = (stale ? "out of date · " : "updated ") +
    (secs < 90 ? `${secs}s ago` : `${Math.round(secs / 60)} min ago`);
  el.style.color = stale ? "#ff8b82" : "#9aa4b0";
  document.body.classList.toggle("stale", stale);
}

// Start this here so the warning still works when the map cannot load.
tick();
setInterval(tick, POLL_MS);
setInterval(() => { render(); paintAge(); }, TICK_MS);
</script>
