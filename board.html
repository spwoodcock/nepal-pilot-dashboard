<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nepal drone flights</title>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.6.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root {
    --airborne: #e0342a; --planned: #e08a00; --landed: #7c848e;
    --stale: #a734c8;    --unparsed: #2d6fd8; --bg: #11151a; --fg: #f2f5f8;
    --idle: #3d4854;
  }
  * { box-sizing: border-box }
  [hidden] { display: none !important }
  html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, sans-serif;
               background: var(--bg); color: var(--fg) }
  #map { position: absolute; inset: 44px 0 0 0 }
  #bar { position: absolute; inset: 0 0 auto 0; height: 44px; display: flex;
         align-items: center; gap: 18px; padding: 0 14px; background: #0b0e12;
         border-bottom: 1px solid #232a33; z-index: 2 }
  #bar b { font-size: 16px; letter-spacing: .3px }
  .count { display: flex; align-items: center; gap: 6px; font: inherit;
           font-variant-numeric: tabular-nums; color: inherit; background: none;
           border: 1px solid transparent; border-radius: 5px; padding: 3px 8px;
           cursor: pointer }
  .count:hover { background: #171d25; border-color: #2c343e }
  .count[aria-pressed="true"], .count[aria-expanded="true"] {
           background: #1d2531; border-color: #465361 }
  #bar.filtering .count[aria-pressed="false"],
  #legend.filtering button[aria-pressed="false"] { opacity: .45 }
  .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block;
         flex: none }
  #age { margin-left: auto; font-variant-numeric: tabular-nums; color: #9aa4b0 }
  #clock { font-variant-numeric: tabular-nums; color: var(--fg);
           padding-left: 18px; border-left: 1px solid #232a33 }
  #banner { position: absolute; inset: 44px 0 auto 0; padding: 11px 14px;
            color: #fff; font-size: 16px; font-weight: 600; text-align: center;
            z-index: 3; display: none }
  #banner .sub { display: block; margin-top: 3px; font-size: 13px;
                 font-weight: 400; opacity: .9 }
  body.stale #banner { display: block; background: #8a5300 }
  body.expired #banner { display: block; background: #b3140a }
  #legend { position: absolute; left: 12px; bottom: 12px; z-index: 2;
            background: #0b0e12dd; border: 1px solid #232a33; border-radius: 6px;
            padding: 10px 12px; line-height: 1.9;
            max-height: calc(100vh - 68px); overflow-y: auto }
  #legend button { display: flex; align-items: center; gap: 8px; width: 100%;
                   font: inherit; color: inherit; text-align: left;
                   background: none; border: 1px solid transparent;
                   border-radius: 5px; padding: 1px 6px; cursor: pointer }
  #legend button:hover { background: #171d25; border-color: #2c343e }
  #legend button[aria-pressed="true"] { background: #1d2531; border-color: #465361 }
  #legend .hint { color: #6f7b88; font-size: 12px; line-height: 1.6;
                  padding: 0 6px 2px }
  #clear-filter { margin-top: 4px; color: #9aa4b0; font-size: 12px;
                  border-color: #2c343e }
  #legal { max-width: 250px; margin: 9px 6px 0; padding-top: 8px;
           border-top: 1px solid #232a33; color: #8d98a5;
           font-size: 12px; line-height: 1.45 }
  #legal b { color: #c6ced7 }
  #legal a { color: #b5bec8 }
  #legal a:hover { color: var(--fg) }

  #pilots { position: absolute; top: 44px; right: 0; bottom: 0; width: 290px;
            max-width: 60vw; z-index: 2; padding: 12px 14px 18px;
            background: #0b0e12f2; border-left: 1px solid #232a33;
            overflow-y: auto }
  #pilots h2 { margin: 0; font-size: 15px }
  #pilots .sum { color: #9aa4b0; margin: 3px 0 6px }
  #pilots ol { list-style: none; margin: 0; padding: 0 }
  #pilots li { display: flex; align-items: baseline; gap: 8px; padding: 4px 6px;
               border-bottom: 1px solid #171d25; border-radius: 5px }
  #pilots li.locatable { cursor: pointer }
  #pilots li.locatable:hover { background: #171d25 }
  #pilots .pid { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                 letter-spacing: .2px }
  #pilots .idle .pid { color: #9aa4b0 }
  #pilots .what { margin-left: auto; text-align: right; color: #9aa4b0;
                  font-variant-numeric: tabular-nums }
  #pilots li.group { display: block; border: 0; margin: 13px 0 3px; padding: 0 6px;
                     color: #6f7b88; font-size: 11px; text-transform: uppercase;
                     letter-spacing: .6px }
  #pilots .foot { color: #6f7b88; font-size: 12px; margin: 16px 0 0 }
  #pilots-close { float: right; font: inherit; line-height: 1; color: #9aa4b0;
                  background: none; border: 1px solid #2c343e; border-radius: 4px;
                  padding: 2px 7px; cursor: pointer }
  #pilots-close:hover { color: var(--fg); border-color: #3d4854 }
  .maplibregl-popup-content { background: #0b0e12; color: var(--fg);
                              border: 1px solid #2c343e; font-size: 13px }
  .maplibregl-popup-content b { display: block; margin-bottom: 4px }
  .maplibregl-popup-tip { border-top-color: #0b0e12 !important }
  .note { color: #9aa4b0; margin-top: 5px; font-style: italic }
  .coords { display: flex; align-items: center; gap: 7px; margin-top: 7px;
            font-variant-numeric: tabular-nums; letter-spacing: .2px }
  .copy { display: flex; padding: 3px; border: 1px solid #2c343e;
          border-radius: 4px; background: #161b22; color: #9aa4b0;
          cursor: pointer; line-height: 0 }
  .copy:hover { color: var(--fg); border-color: #3d4854 }
  .copy.done { color: #6cd07a; border-color: #6cd07a }
  .copy.failed { color: #ff8b82; border-color: #ff8b82 }
</style>

<div id="bar">
  <b>Nepal drone flights</b>
  <button type="button" class="count" data-status="airborne" aria-pressed="false"
          title="Show only flights in the air"><i class="dot" style="background:var(--airborne)"></i><span id="c-airborne">0</span> in the air</button>
  <button type="button" class="count" data-status="planned" aria-pressed="false"
          title="Show only planned flights"><i class="dot" style="background:var(--planned)"></i><span id="c-planned">0</span> planned</button>
  <button type="button" class="count" data-status="stale" aria-pressed="false"
          title="Show only overdue flights"><i class="dot" style="background:var(--stale)"></i><span id="c-stale">0</span> overdue</button>
  <button type="button" class="count" data-status="landed" aria-pressed="false"
          title="Show only landed flights"><i class="dot" style="background:var(--landed)"></i><span id="c-landed">0</span> landed</button>
  <button type="button" class="count" id="pilots-btn" aria-expanded="false"
          aria-controls="pilots" hidden
          title="List the pilots seen in the data"><span id="c-pilots">0</span> pilots</button>
  <span id="age">waiting for flight data…</span>
  <span id="clock"></span>
</div>
<div id="banner"></div>
<div id="map"></div>
<div id="legend">
  <div class="hint">click to show only that status</div>
  <button type="button" data-status="airborne" aria-pressed="false"><i class="dot" style="background:var(--airborne)"></i> currently in the air</button>
  <button type="button" data-status="planned" aria-pressed="false"><i class="dot" style="background:var(--planned)"></i> due to fly</button>
  <button type="button" data-status="stale" aria-pressed="false"><i class="dot" style="background:var(--stale)"></i> overdue - no landing message</button>
  <button type="button" data-status="landed" aria-pressed="false"><i class="dot" style="background:var(--landed)"></i> recently landed</button>
  <button type="button" data-status="unparsed" aria-pressed="false"><i class="dot" style="background:var(--unparsed)"></i> report received - flight times unclear</button>
  <button type="button" id="clear-filter" hidden>show every flight again</button>
  <p id="legal"><b>Not an aviation deconfliction tool.</b> Markers show only the flights
    pilots have reported by WhatsApp, so an empty map does not mean empty
    airspace. Provided “as is”, without warranty.
    <a href="https://github.com/spwoodcock/nepal-pilot-dashboard" target="_blank"
       rel="noopener noreferrer">Source</a> ·
    <a href="https://github.com/spwoodcock/nepal-pilot-dashboard/blob/main/LICENSE.md"
       target="_blank" rel="noopener noreferrer">full license</a>.</p>
</div>
<aside id="pilots" hidden>
  <button type="button" id="pilots-close" aria-label="Close the pilot list">close</button>
  <h2>Pilots</h2>
  <p class="sum" id="pilots-sum"></p>
  <ol id="pilots-list"></ol>
  <p class="foot" id="pilots-foot"></p>
</aside>

<script type="module">
import * as maplibregl from "https://cdn.jsdelivr.net/npm/maplibre-gl@6.6.0/dist/maplibre-gl.mjs";

const FEED = "./flights.geojson";
const POLL_MS = 15000;
const TICK_MS = 1000;
// Warn after three missed exports, but keep positions until they are too old to use.
const STALE_S = 180;
const EXPIRED_S = 60 * 60;
const NEPAL_MIN = 5 * 60 + 45;

let map = null, mapReady = false, feed = null, lastGenerated = null, fitted = false;
let fatal = null, bannerHtml = null, mapBox = null, popup = null, listHtml = null;

const filter = new Set();
let current = new Map();

const COLOUR = ["match", ["get", "status"],
  "airborne", "#e0342a", "planned", "#e08a00", "landed", "#7c848e",
  "stale", "#a734c8", "#2d6fd8"];
const STATUS_TEXT = {
  airborne: "in the air", planned: "planned", stale: "overdue",
  landed: "landed", unparsed: "flight times unclear"
};

try {
  map = new maplibregl.Map({
    container: "map",
    center: [85.30, 27.95],
    zoom: 9.2,
    style: {
      version: 8,
      sources: {
        osm: {
          type: "raster", tileSize: 256, maxzoom: 19,
          tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
          attribution: "© OpenStreetMap contributors"
        }
      },
      layers: [
        { id: "osm", type: "raster", source: "osm",
          paint: { "raster-saturation": -0.6, "raster-brightness-max": 0.82 } }
      ]
    }
  });
  map.addControl(new maplibregl.NavigationControl(), "top-right");
  map.addControl(new maplibregl.ScaleControl());
  map.on("error", e => console.error("Map error", e && e.error));
  map.on("load", onMapLoad);
} catch (err) {
  console.error("The map could not start", err);
  showFatal("The map did not load. The counts are still live; " +
            "this browser may not support WebGL 2.");
}

function showFatal(text) {
  fatal = text;
  paintAge();
}

function onMapLoad() {
  map.addSource("flights", { type: "geojson", data: { type: "FeatureCollection", features: [] } });

  map.addLayer({
    id: "halo", type: "circle", source: "flights",
    filter: ["in", ["get", "status"], ["literal", ["airborne", "stale"]]],
    paint: {
      "circle-radius": 26, "circle-color": COLOUR, "circle-opacity": 0.18,
      "circle-blur": 0.4
    }
  });
  map.addLayer({
    id: "dot", type: "circle", source: "flights",
    paint: {
      "circle-radius": ["match", ["get", "status"], "airborne", 11, "stale", 11, 8],
      "circle-color": COLOUR,
      "circle-opacity": ["match", ["get", "status"], "planned", 0.35, "landed", 0.5, 1],
      "circle-stroke-width": 2,
      "circle-stroke-color": COLOUR,
      "circle-stroke-opacity": 0.95
    }
  });
  map.addLayer({
    id: "label", type: "symbol", source: "flights",
    layout: {
      "text-field": ["get", "label"], "text-size": 12, "text-offset": [0, 1.5],
      "text-anchor": "top", "text-allow-overlap": false,
      "text-font": ["Open Sans Regular", "Arial Unicode MS Regular"]
    },
    paint: { "text-color": "#f2f5f8", "text-halo-color": "#11151a", "text-halo-width": 1.6 }
  });

  map.on("click", "dot", e => openPopup(e.features[0].properties));
  map.on("mouseenter", "dot", () => map.getCanvas().style.cursor = "pointer");
  map.on("mouseleave", "dot", () => map.getCanvas().style.cursor = "");

  mapReady = true;
  render();
}

function openPopup(p) {
  if (popup) popup.remove();
  popup = new maplibregl.Popup({ closeButton: false })
    .setLngLat([p.lon, p.lat])
    .setHTML(
      `<b>Pilot ${p.pilot}</b>` +
      `${STATUS_TEXT[p.status] || p.status}<br>` +
      `take-off ${hhmm(p.takeoff)} &nbsp; landing ${hhmm(p.landing)}<br>` +
      `reported at ${hhmm(p.reported_at)}` +
      (p.note ? `<div class="note">“${escapeHtml(p.note)}”</div>` : "") +
      coordRow(p.lat, p.lon) +
      `<div class="note">Reported via WhatsApp channel</div>`)
    .addTo(map);
}

// Five decimals is roughly a metre, and lat,lon is the order the tools a
// controller pastes into expect.
const coordText = (lat, lon) => `${(+lat).toFixed(5)}, ${(+lon).toFixed(5)}`;

const CLIPBOARD_ICON =
  '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" ' +
  'stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
  'stroke-linejoin="round" aria-hidden="true">' +
  '<rect x="9" y="9" width="12" height="12" rx="2"></rect>' +
  '<path d="M5 15V5a2 2 0 0 1 2-2h8"></path></svg>';

function coordRow(lat, lon) {
  const text = coordText(lat, lon);
  return `<div class="coords"><span class="coord-value">${text}</span>` +
         `<button type="button" class="copy" data-copy="${text}" ` +
         `title="Copy coordinates" aria-label="Copy coordinates">` +
         `${CLIPBOARD_ICON}</button></div>`;
}

document.addEventListener("click", async ev => {
  const btn = ev.target.closest(".copy");
  if (!btn) return;
  const ok = await copyText(btn.dataset.copy);
  if (!ok) selectText(btn.parentElement.querySelector(".coord-value"));
  btn.classList.add(ok ? "done" : "failed");
  btn.title = ok ? "Copied" : "Could not copy - press Ctrl+C";
  setTimeout(() => {
    btn.classList.remove("done", "failed");
    btn.title = "Copy coordinates";
  }, 1600);
});

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (err) {
    // The clipboard API needs a secure context; fall back for plain http.
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:-1000px";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (err2) { ok = false; }
    ta.remove();
    return ok;
  }
}

function selectText(el) {
  if (!el) return;
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

const pad2 = v => String(v).padStart(2, "0");

function nepal(d) {
  return new Date(d.getTime() + (NEPAL_MIN + d.getTimezoneOffset()) * 60000);
}

function hhmm(iso) {
  if (!iso) return "not reported";
  const n = nepal(new Date(iso));
  return pad2(n.getHours()) + ":" + pad2(n.getMinutes());
}

// Use Nepal time; ticking seconds also show that the page is responsive.
function paintClock() {
  const n = nepal(new Date());
  document.getElementById("clock").textContent =
    `${pad2(n.getHours())}:${pad2(n.getMinutes())}:${pad2(n.getSeconds())} NPT`;
}
const escapeHtml = s => s.replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function mins(iso) {
  const m = Math.round((new Date(iso) - Date.now()) / 60000);
  return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`;
}

// Keep this in sync with status_of() so flights update between feed refreshes.
function statusOf(p, now, th) {
  const to = p.takeoff ? Date.parse(p.takeoff) : null;
  const ldg = p.landing ? Date.parse(p.landing) : null;
  const min = 60000;
  const PRE = th.pre_window_min * min, POST = th.post_window_min * min;
  const STALE = th.stale_after_min * min, DROP = th.drop_stale_after_min * min;
  if (!to && !ldg) {
    const seen = p.reported_at ? Date.parse(p.reported_at) : now;
    return now > seen + STALE ? null : p.status;
  }
  if (ldg && p.landing_confirmed && now >= ldg + POST) return null;
  if (to && now > to + DROP) return null;
  if (ldg && now >= ldg + POST) return "stale";
  if (ldg && now >= ldg) return "landed";
  if (to && now < to - PRE) return "planned";
  if (to && !ldg && now > to + STALE) return "stale";
  return "airborne";
}

function render() {
  if (!feed) return;
  const now = Date.now();
  const th = feed.properties.thresholds || {};
  const counts = { airborne: 0, planned: 0, stale: 0, landed: 0, unparsed: 0 };
  const features = [];
  current = new Map();

  for (const f of feed.features) {
    const p = { ...f.properties };
    const status = statusOf(p, now, th);
    if (!status) continue;
    p.status = status;
    counts[status] = (counts[status] || 0) + 1;
    // Copy the pin through properties: geometry queried back off the map has
    // been through tiling, which moves it by metres at these zooms.
    p.lon = f.geometry.coordinates[0];
    p.lat = f.geometry.coordinates[1];
    p.label = `${p.pilot}\n` + (
      status === "planned" ? `starts in ${mins(p.takeoff)}` :
      status === "airborne" && p.landing ? `lands at ${hhmm(p.landing)}` :
      status === "stale" ? `overdue since ${hhmm(p.landing || p.takeoff)}` :
      status === "landed" ? `landed ${hhmm(p.landing)}` : "flight times unclear");
    features.push({ ...f, properties: p });
    current.set(p.pilot, p);
  }

  for (const s of ["airborne", "planned", "stale", "landed"])
    document.getElementById("c-" + s).textContent = counts[s] || 0;

  // Keep total counts visible while filtering.
  if (mapReady)
    map.getSource("flights").setData({
      type: "FeatureCollection",
      features: filter.size
        ? features.filter(f => filter.has(f.properties.status)) : features
    });

  renderPilots(now, th);
}

function paintFilter() {
  const on = filter.size > 0;
  document.getElementById("bar").classList.toggle("filtering", on);
  document.getElementById("legend").classList.toggle("filtering", on);
  for (const el of document.querySelectorAll("[data-status]"))
    el.setAttribute("aria-pressed", String(filter.has(el.dataset.status)));
  document.getElementById("clear-filter").hidden = !on;
}

function setFilter(statuses) {
  filter.clear();
  for (const status of statuses) filter.add(status);
  paintFilter();
  render();
}

document.addEventListener("click", ev => {
  const btn = ev.target.closest("[data-status]");
  if (!btn) return;
  const status = btn.dataset.status;
  setFilter(filter.has(status) ? [...filter].filter(s => s !== status)
                               : [...filter, status]);
});

document.getElementById("clear-filter").addEventListener("click", () => setFilter([]));

document.addEventListener("keydown", ev => {
  if (ev.key !== "Escape") return;
  if (filter.size) setFilter([]);
  else showPilots(false);
});

// WhatsApp provides no name or phone number, so pilots use re-keyed sender IDs.

const PILOT_ORDER = { airborne: 0, stale: 1, planned: 2, landed: 3, unparsed: 4 };

function pilotWhat(r) {
  switch (r.status) {
    case "airborne": return r.landing ? `lands ${hhmm(r.landing)}` : "in the air";
    case "planned":  return `flies ${hhmm(r.takeoff)}`;
    case "stale":    return `overdue since ${hhmm(r.landing || r.takeoff)}`;
    case "landed":   return `landed ${hhmm(r.landing)}`;
    case "unparsed": return "times unclear";
    default:         return `last report ${hhmm(r.reported_at)}`;
  }
}

function pilotRow(r) {
  const colour = r.status ? `var(--${r.status})` : "var(--idle)";
  const found = current.has(r.pilot);
  const cls = [r.status ? "" : "idle", found ? "locatable" : ""].filter(Boolean);
  return `<li class="${cls.join(" ")}" data-pilot="${escapeHtml(r.pilot)}"` +
         (found ? ` title="Show this pilot on the map"` : "") + `>` +
         `<i class="dot" style="background:${colour}"></i>` +
         `<span class="pid">${escapeHtml(r.pilot)}</span>` +
         `<span class="what">${pilotWhat(r)}${r.located ? "" : " · no pin"}</span></li>`;
}

function renderPilots(now, th) {
  const roster = feed && feed.properties.pilots;
  const btn = document.getElementById("pilots-btn");
  if (!roster) { btn.hidden = true; return; }  // Support feeds from older exporters.

  btn.hidden = false;
  document.getElementById("c-pilots").textContent = roster.length;
  const panel = document.getElementById("pilots");
  if (panel.hidden) return;

  // Recompute statuses so the list and markers agree between feed refreshes.
  const rows = roster.map(r => ({ ...r, status: statusOf(r, now, th) }));
  const flying = rows.filter(r => r.status).sort((a, b) =>
    PILOT_ORDER[a.status] - PILOT_ORDER[b.status] || a.pilot.localeCompare(b.pilot));
  const done = rows.filter(r => !r.status).sort((a, b) =>
    Date.parse(b.reported_at) - Date.parse(a.reported_at));
  const hours = feed.properties.window_hours;

  document.getElementById("pilots-sum").textContent =
    `${flying.length} with a current flight · ${rows.length} seen` +
    (hours ? ` in the last ${hours}h` : "");
  document.getElementById("pilots-foot").textContent =
    "Pilots are counted by who sent the reports. WhatsApp gives no names or " +
    "phone numbers, so each one is an anonymous id that stays the same all day.";

  const html =
    (flying.length ? `<li class="group">flying now</li>` +
                     flying.map(pilotRow).join("") : "") +
    (done.length ? `<li class="group">earlier in the window</li>` +
                   done.map(pilotRow).join("") : "") +
    (rows.length ? "" : `<li class="group">no pilots have reported yet</li>`);
  if (html !== listHtml) document.getElementById("pilots-list").innerHTML = listHtml = html;
}

function showPilots(open) {
  const panel = document.getElementById("pilots");
  panel.hidden = !open;
  document.getElementById("pilots-btn").setAttribute("aria-expanded", String(open));
  listHtml = null;
  render();
  paintAge();
}

document.getElementById("pilots-btn").addEventListener("click", () =>
  showPilots(document.getElementById("pilots").hidden));
document.getElementById("pilots-close").addEventListener("click", () => showPilots(false));

document.getElementById("pilots-list").addEventListener("click", ev => {
  const row = ev.target.closest("li[data-pilot]");
  if (!row || !mapReady) return;
  const flight = current.get(row.dataset.pilot);
  if (!flight) return;
  if (filter.size && !filter.has(flight.status)) setFilter([]);
  map.flyTo({ center: [flight.lon, flight.lat],
              zoom: Math.max(map.getZoom(), 12), duration: 700 });
  openPopup(flight);
});

async function tick() {
  try {
    const res = await fetch(FEED, { cache: "no-cache" });
    if (!res.ok) throw new Error(res.status);
    feed = await res.json();
    render();

    const gen = new Date(feed.properties.generated_at);
    if (!isNaN(gen)) lastGenerated = gen;
    if (mapReady && !fitted && feed.properties.bbox) {
      const b = feed.properties.bbox;
      map.fitBounds([[b[0], b[1]], [b[2], b[3]]], { padding: 60, duration: 0 });
      fitted = true;
    }
  } catch (err) {
    console.error("Could not load flight data", err);
  }
  paintAge();
}

function ago(secs) {
  if (secs < 90) return `${secs}s ago`;
  const m = Math.round(secs / 60);
  return m < 90 ? `${m} min ago` : `${Math.floor(m / 60)}h ${m % 60}m ago`;
}

function paintAge() {
  const el = document.getElementById("age");
  const banner = document.getElementById("banner");
  const secs = lastGenerated ? Math.round((Date.now() - lastGenerated) / 1000) : null;
  let level = "", html = "";

  if (secs === null) {
    el.textContent = "no flight data yet";
    el.style.color = "#ffc27a";
    level = "stale";
    html = "No flight data has arrived yet." +
           `<span class="sub">The map is empty because nothing has been ` +
           `received - not because the sky is clear.</span>`;
  } else {
    const stopped = `stopped updating at ${hhmm(lastGenerated.toISOString())} ` +
                    `(${ago(secs)})`;
    el.textContent = (secs > STALE_S ? "not updating · last update " : "updated ") +
                     ago(secs);
    el.style.color = secs > STALE_S ? "#ff8b82" : "#9aa4b0";

    if (secs > EXPIRED_S) {
      level = "expired";
      html = `Flight data ${stopped} - too old to plan against.` +
             `<span class="sub">These are the last known positions. Do not ` +
             `rely on this map; contact pilots directly.</span>`;
    } else if (secs > STALE_S) {
      level = "stale";
      html = `Flight data ${stopped}.` +
             `<span class="sub">Showing the last known positions. Take-off ` +
             `and landing times are as reported, so nothing here is ` +
             `confirmed since that update.</span>`;
    }
  }

  if (fatal) { level = "expired"; html = fatal; }

  if (html !== bannerHtml) {
    banner.innerHTML = bannerHtml = html;
    document.body.classList.toggle("stale", level === "stale");
    document.body.classList.toggle("expired", level === "expired");
  }
  fitMapUnderBanner(banner.offsetHeight);
}

// Keep overlays from covering markers and map controls.
function fitMapUnderBanner(bannerPx) {
  const panel = document.getElementById("pilots");
  const top = 44 + bannerPx;
  const right = panel.hidden ? 0 : panel.offsetWidth;
  const box = top + ":" + right;
  if (box === mapBox) return;
  mapBox = box;
  panel.style.top = top + "px";
  Object.assign(document.getElementById("map").style,
                { top: top + "px", right: right + "px" });
  if (map) map.resize();
}

// Start outside map initialization so feed warnings work if the map fails.
paintFilter();
tick();
paintClock();
setInterval(tick, POLL_MS);
setInterval(() => { render(); paintAge(); paintClock(); }, TICK_MS);
</script>
